name: Deploy to Lightsail

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate required secrets
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          LIGHTSAIL_IP: ${{ secrets.LIGHTSAIL_IP }}
          LIGHTSAIL_SSH_PRIVATE_KEY: ${{ secrets.LIGHTSAIL_SSH_PRIVATE_KEY }}
          SSH_USER: ${{ secrets.SSH_USER }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          set -euo pipefail
          required=(
            AWS_ACCESS_KEY_ID
            AWS_SECRET_ACCESS_KEY
            LIGHTSAIL_IP
            LIGHTSAIL_SSH_PRIVATE_KEY
            SSH_USER
            AWS_REGION
          )

          for key in "${required[@]}"; do
            if [ -z "${!key:-}" ]; then
              echo "Missing required secret: ${key}"
              exit 1
            fi
          done

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Write SSH key
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          printf "%s" "${{ secrets.LIGHTSAIL_SSH_PRIVATE_KEY }}" > "$HOME/.ssh/lightsail.pem"
          chmod 600 "$HOME/.ssh/lightsail.pem"

      - name: Deploy
        env:
          LIGHTSAIL_IP: ${{ secrets.LIGHTSAIL_IP }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ github.workspace }}/.github/lightsail.pem
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          set -euo pipefail
          cp "$HOME/.ssh/lightsail.pem" "${GITHUB_WORKSPACE}/.github/lightsail.pem"
          bash ./deploy/deploy.sh

      - name: Cleanup SSH key
        if: always()
        run: |
          rm -f "$HOME/.ssh/lightsail.pem" "${GITHUB_WORKSPACE}/.github/lightsail.pem"
