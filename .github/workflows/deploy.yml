name: Deploy to Lightsail

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate required secrets
        env:
          LIGHTSAIL_IP: ${{ secrets.LIGHTSAIL_IP }}
          LIGHTSAIL_SSH_PRIVATE_KEY: ${{ secrets.LIGHTSAIL_SSH_PRIVATE_KEY }}
          SSH_USER: ${{ secrets.SSH_USER }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          set -euo pipefail
          required=(
            LIGHTSAIL_IP
            LIGHTSAIL_SSH_PRIVATE_KEY
            SSH_USER
            AWS_REGION
          )

          for key in "${required[@]}"; do
            if [ -z "${!key:-}" ]; then
              echo "Missing required secret: ${key}"
              exit 1
            fi
          done

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::779400169222:role/fluo-deploy
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Write SSH key
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          printf "%s" "${{ secrets.LIGHTSAIL_SSH_PRIVATE_KEY }}" > "$HOME/.ssh/lightsail.pem"
          chmod 600 "$HOME/.ssh/lightsail.pem"

      - name: Deploy
        env:
          LIGHTSAIL_IP: ${{ secrets.LIGHTSAIL_IP }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ github.workspace }}/.github/lightsail.pem
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          set -euo pipefail
          cp "$HOME/.ssh/lightsail.pem" "${GITHUB_WORKSPACE}/.github/lightsail.pem"
          bash ./deploy/deploy.sh

      - name: Cleanup SSH key
        if: always()
        run: |
          rm -f "$HOME/.ssh/lightsail.pem" "${GITHUB_WORKSPACE}/.github/lightsail.pem"
